<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goetheGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#008f58"/>
      <stop offset="100%" stop-color="#005a36"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#goetheGrad)"/>

  <!-- Inner subtle border -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#ffffff" stroke-width="6" stroke-opacity="0.25"/>

  <!-- Center Card -->
  <g filter="url(#shadow)">
    <rect x="76" y="80" width="360" height="352" rx="36" fill="#ffffff"/>
  </g>

  <!-- Goethe green header badge inside card -->
  <rect x="76" y="80" width="360" height="88" rx="36" fill="#007346"/>
  <rect x="76" y="132" width="360" height="36" fill="#007346"/>

  <text x="256" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">GOETHE</text>

  <!-- Big A1 Text -->
  <text x="256" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="110" font-weight="900" fill="#007346" text-anchor="middle" letter-spacing="-2">A1</text>

  <!-- Subtitle -->
  <text x="256" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#334155" text-anchor="middle" letter-spacing="2">START DEUTSCH 1</text>

  <!-- Audio & Speaking Waves Accent -->
  <g transform="translate(196, 355)" stroke="#007346" stroke-width="4.5" stroke-linecap="round">
    <line x1="0" y1="20" x2="0" y2="36" />
    <line x1="15" y1="12" x2="15" y2="44" />
    <line x1="30" y1="4" x2="30" y2="52" />
    <line x1="45" y1="10" x2="45" y2="46" />
    <line x1="60" y1="0" x2="60" y2="56" />
    <line x1="75" y1="10" x2="75" y2="46" />
    <line x1="90" y1="4" x2="90" y2="52" />
    <line x1="105" y1="12" x2="105" y2="44" />
    <line x1="120" y1="20" x2="120" y2="36" />
  </g>
</svg>
